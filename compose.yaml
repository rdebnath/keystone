# Local development only — this file is NOT used to build the application image.
#
# Jib builds the production image directly (no Dockerfile, no `docker build`, no local Docker
# daemon), see docs/ARCHITECTURE.md §7.2. Docker is used for two other purposes:
#   1. a local PostgreSQL so an app can run outside Cloud Run, and
#   2. the Testcontainers integration tests (which require a Docker daemon).
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: inventory
      POSTGRES_USER: keystone
      POSTGRES_PASSWORD: keystone
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keystone"]
      interval: 5s
      timeout: 5s
      retries: 5
