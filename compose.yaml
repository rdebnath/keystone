# Local development only — this file is NOT used to build the application image.
#
# Jib builds the production image directly (no Dockerfile, no `docker build`, no local Docker
# daemon), see docs/ARCHITECTURE.md §7.2. Docker is used for two other purposes:
#   1. a local PostgreSQL so an app can run outside Cloud Run, and
#   2. the Testcontainers integration tests (which require a Docker daemon).
#
# A single PostgreSQL instance hosts every app. Apps are isolated by SCHEMA, not database:
#   - inventory app            -> schema `inventory`
#   - platform admin (library) -> schema `platform`
# Each schema is created idempotently at startup.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: keystone
      POSTGRES_USER: keystone
      POSTGRES_PASSWORD: keystone
    ports:
      - "5432:5432"
    volumes:
      # Initializes the `inventory` and `platform` schemas + tables on first start (empty data
      # volume). Generated from the Liquibase changelogs — see docker/initdb/init.sql.
      - ./docker/initdb/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keystone"]
      interval: 5s
      timeout: 5s
      retries: 5

