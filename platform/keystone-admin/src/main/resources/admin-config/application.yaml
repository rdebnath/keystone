# Base defaults shared by every environment (platform admin console library).
#
# Non-secret values (Supabase URL, OIDC issuer/JWKS) are filled in per environment
# (admin-config/application-{env}.yaml). Only secrets — the Supabase service-role key and the
# bootstrap admin password — are supplied via environment variables (Cloud Run -> Secret Manager).
# The platform's database connection is inherited from the hosting application (same database,
# `platform` schema).

supabase:
  url: ""                # Supabase project URL (set in admin-config/application-{env}.yaml)
  serviceRoleKey: ""     # server-only secret; never commit a real value (SUPABASE_SERVICE_ROLE_KEY)

security:
  issuer: ""             # Supabase Auth issuer — the project URL + /auth/v1, e.g.
                         # https://<ref>.supabase.co/auth/v1 (set per environment)
  audience: "authenticated"   # Supabase Auth JWT audience
  jwksUrl: ""            # e.g. https://<ref>.supabase.co/auth/v1/.well-known/jwks.json (set per environment)

bootstrap:
  enabled: true                 # seed the permission catalog + platform-admin role + first admin user at
                                # startup; set false (or BOOTSTRAP_ON_START=false) to skip it, e.g. when the
                                # schema/roles are provisioned out of band (admin credentials then optional)
  adminUsername: ""             # required per environment when enabled — the first platform admin's login
                                # local-part, e.g. "admin" (set in admin-config/application-{env}.yaml)
  adminEmail: ""                # required per environment when enabled — the admin's virtual/fake Supabase
                                # email; never delivered, so it need not be a real mailbox
  adminPassword: "changeit"     # well-known initial password for local development; a real deployment
                                # overrides it via BOOTSTRAP_ADMIN_PASSWORD (or yaml)
