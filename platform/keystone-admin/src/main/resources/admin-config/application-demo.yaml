# Demo environment — shared Supabase project. Non-secret values only; the service-role key comes
# from SUPABASE_SERVICE_ROLE_KEY (environment variable / Secret Manager).
supabase:
  url: https://gxswbqcbxorfiinfdqke.supabase.co
security:
  issuer: https://gxswbqcbxorfiinfdqke.supabase.co/auth/v1
  audience: authenticated
  jwksUrl: https://gxswbqcbxorfiinfdqke.supabase.co/auth/v1/.well-known/jwks.json

# The first platform admin this deployment bootstraps — a per-deployment decision, so it lives here
# rather than in the code. The Supabase email is virtual (never delivered) but must be unique in the
# project, so a shared project needs a distinct value per environment.
bootstrap:
  adminUsername: admin
  adminEmail: admin@keystone.com
