name: inventory
description: Inventory application frontend — hosts the Keystone platform admin UI and adds the
  inventory UI, routing between them by the authenticated user.
publish_to: 'none'
version: 0.0.1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2
  keystone_admin_ui:
    path: ../../../platform/keystone-admin-ui

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
