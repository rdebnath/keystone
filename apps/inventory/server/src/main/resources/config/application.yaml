# Base defaults shared by every environment.
#
# Non-secret values are filled in per environment (application-{env}.yaml). Only secrets
# (database.password, realtime.serviceRoleKey) are supplied at runtime via environment
# variables (Cloud Run -> Secret Manager).

database:
  url: ""                # required per environment (set in application-{env}.yaml)
  username: ""           # required per environment (set in application-{env}.yaml)
  password: ""           # secret (DB_PASSWORD)
  maxPoolSize: 10
  schema: ""             # optional: blank = default (public) schema of the database named in `url`
                         #          (separate database per app); set to a value (e.g. "inventory")
                         #          to isolate apps by schema within a shared database
  read:                  # read target: a read replica, or the primary (read/write on one instance)
    url: ""              # required per environment (application-{env}.yaml); set equal to database.url
                         # for read/write on one instance, or to a replica URL to enable a replica
    username: ""         # blank = database.username
    password: ""         # blank = database.password; never commit a real value
    maxPoolSize: ""      # blank = database.maxPoolSize

platform:
  schema: "platform"     # schema in the shared DB where the hosted platform admin console lives

server:
  port: 8080             # HTTP port (no environment override)
  contextPath: /inventory  # URL prefix the app serves under (e.g. localhost:8080/inventory)

cors:
  allowedOrigins: []     # empty = CORS disabled; ["*"] = allow any origin (set per environment)

realtime:
  endpoint: ""           # optional until Supabase Realtime is wired
  serviceRoleKey: ""     # secret (REALTIME_SERVICE_ROLE_KEY) when Realtime is enabled; never commit it

security:
  issuer: ""             # optional until OIDC is wired
  audience: ""
